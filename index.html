<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f4ef"><title>我的路 · V2</title><link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=4"><link rel="icon" type="image/png" href="./icon-192.png?v=4"><style>
:root{--bg:#f7f4ef;--card:#fffefa;--ink:#303c35;--muted:#8c948e;--green:#557b69;--line:#ebe9e1;--pink:#f9e9e7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}main{max-width:580px;margin:auto;padding:20px 16px 110px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:25px;font-weight:750}.sub{font-size:12px;color:var(--muted);margin-top:5px}.pill{border:0;background:#e9efe9;border-radius:25px;padding:9px 13px;color:#496958}.card{background:var(--card);border-radius:20px;padding:16px;margin:14px 0;box-shadow:0 4px 18px #43472f08}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.title{font-weight:700;font-size:17px}.small{font-size:12px;color:var(--muted)}.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.day{border:0;background:transparent;border-radius:13px;padding:8px 1px;min-height:46px;color:var(--ink)}.day.sel{background:#dcebe0;color:#2f684f;font-weight:800}.day .dot{display:block;width:4px;height:4px;border-radius:50%;background:#d49e88;margin:3px auto 0}.dow{font-size:11px;color:var(--muted);padding:7px 0}.section{font-weight:750;margin:19px 0 9px}.item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--line);gap:8px}.item:first-of-type{border-top:0}.action{background:#eef4ed;color:#3b6b55;border:0;border-radius:12px;padding:8px 12px}.soft{background:#f7f2ed;border:0;border-radius:11px;padding:9px}.muted{color:var(--muted)}.chip{border:1px solid #e6e8e0;background:white;border-radius:14px;padding:9px 11px;margin:4px 5px 4px 0}.chip.active{background:#e1eee5;border-color:#9dbca6}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffefbea;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 3px calc(10px + env(safe-area-inset-bottom));backdrop-filter:blur(12px);z-index:5}.nav button{border:0;background:none;color:#909b91;font-size:11px;display:grid;gap:4px;text-align:center}.nav button.active{color:#47725c;font-weight:700}.nav b{font-size:20px}.fab{position:fixed;bottom:84px;right:max(18px,calc((100vw - 580px)/2 + 18px));border:0;border-radius:50%;background:#648b74;color:white;width:52px;height:52px;font-size:30px;box-shadow:0 6px 20px #53765d55;z-index:4}.overlay{position:fixed;inset:0;background:#202b2380;z-index:10;display:flex;align-items:flex-end;justify-content:center}.sheet{width:100%;max-width:580px;max-height:89vh;overflow:auto;background:#fffefa;border-radius:25px 25px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom))}.field{display:grid;gap:7px;margin:12px 0}.field input,.field textarea,.field select{width:100%;border:1px solid #e3e7df;border-radius:12px;background:white;padding:12px;outline-color:#8bad93}.field textarea{min-height:72px}.primary{border:0;border-radius:13px;background:#5e866f;color:white;padding:12px 18px}.danger{color:#b15b54;background:#f9eeeb;border:0;border-radius:12px;padding:11px}.tag{background:#f4f1e9;border-radius:10px;padding:5px 9px;font-size:12px}.empty{padding:12px;color:#9ca39b;font-size:13px}.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat>div{background:#f7f5ee;padding:12px;border-radius:13px}.stat strong{font-size:20px;display:block;margin-top:5px}.toast{position:fixed;left:50%;top:26%;transform:translateX(-50%);background:#fff8e9;border:1px solid #e8d9b3;border-radius:18px;padding:20px 25px;box-shadow:0 9px 50px #4443;z-index:20;text-align:center;animation:pop .8s ease forwards;pointer-events:none}@keyframes pop{0%{opacity:0;transform:translate(-50%,15px) scale(.85)}25%{opacity:1;transform:translate(-50%,0) scale(1.05)}75%{opacity:1}100%{opacity:0}}.hide{display:none}.note{line-height:1.7;font-size:13px;color:#77837a}.bar{height:7px;background:#ecece4;border-radius:8px;overflow:hidden;margin-top:7px}.bar>i{display:block;height:100%;background:#92b99a}.floatright{float:right}.hstack{display:flex;gap:8px;flex-wrap:wrap}.hero{background:linear-gradient(120deg,#e9f1e9,#fff2e7)}.mini{font-size:13px}
</style></head><body><main><header class="top"><div><div class="brand">🍃 日子发生中</div><div class="sub">日子慢慢过，喜欢的慢慢攒。</div></div><button class="pill" onclick="openSettings()">⚙️ 设置</button></header><div id="app"><section class="card hero"><div class="title">📅 今天 · 我的路</div><p>欢迎来到你的生活记录空间。</p><p class="note">如果你看到这段提示，而不是日历和记录卡片，说明当前文件预览未能运行应用脚本。请将HTML文件保存到「文件」，再通过 Safari 打开，或部署到固定网址使用。</p><div class="hstack"><span class="tag">💼 工作</span><span class="tag">🌿 生活</span><span class="tag">🏡 小金库</span><span class="tag">🌱 习惯</span></div></section></div></main><button class="fab" onclick="quick()">＋</button><nav class="nav" id="nav"><span>☀️ 今天</span><span>💼 工作</span><span>🌿 生活</span><span>🏡 小金库</span><span>🌱 习惯</span></nav><div id="modal"></div><script>
const KEY='myroad_v2_records',CFG='myroad_v2_settings';
let records=read(KEY,[]),settings=read(CFG,{salary:10000,workdays:22,budget:5000,foods:['🍜 拉面','🍲 麻辣烫','🍚 米饭','🥪 三明治','🍝 意面','🥗 沙拉','🍳 鸡蛋','🍞 面包','🍱 便当'],habits:[{name:'英语',emoji:'🇬🇧',target:4,period:'week'},{name:'阅读',emoji:'📖',target:4,period:'week'},{name:'运动',emoji:'🏃',target:3,period:'week'},{name:'观影',emoji:'🎬',target:2,period:'month'},{name:'睡眠',emoji:'🌙',target:5,period:'week'}]}),tab='today',date=localDate(new Date()),expanded=false,editing=null;
function read(k,f){try{return JSON.parse(localStorage.getItem(k))||f}catch{return f}}function persist(){localStorage.setItem(KEY,JSON.stringify(records));localStorage.setItem(CFG,JSON.stringify(settings))}function localDate(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function dt(s){return new Date(s+'T12:00:00')}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return '¥'+Number(n||0).toFixed(2)}function fmt(s){return s.slice(5).replace('-','月')+'日'}function recs(d=date){return records.filter(x=>x.date===d).sort((a,b)=>(a.time||'').localeCompare(b.time||''))}function typ(t){return {work:'💼 工作',meal:'🍱 三餐',expense:'💸 支出',income:'💰 收入',emotion:'💌 情绪口袋',reading:'📖 阅读',movie:'🎬 观影',sport:'🏃 运动',habit:'🌱 习惯',trip:'✈️ 旅行',walk:'🚶 城市漫游',idea:'💡 创意',task:'📌 任务',wish:'🎁 心愿',sleep:'🌙 睡眠',plan:'🗓️ 计划'}[t]||t}function allType(t,d=date){return recs(d).filter(x=>x.type===t)}function item(x){return `<div class="item"><div><span class="mini">${typ(x.type)}</span><div style="margin-top:4px">${esc(x.title||x.category||'记录')} ${x.amount!==undefined?'<b>'+money(x.amount)+'</b>':''}</div>${x.note?'<div class="small">'+esc(x.note)+'</div>':''}</div><button class="action" onclick="edit('${x.id}')">编辑</button></div>`}function card(title,inner){return `<section class="card"><div class="title">${title}</div>${inner}</section>`}
function calendar(){let cur=dt(date),y=cur.getFullYear(),m=cur.getMonth(),first=new Date(y,m,1),start=new Date(cur);if(expanded){start=new Date(y,m,1-first.getDay())}else{start.setDate(cur.getDate()-cur.getDay())}let count=expanded?Math.ceil((new Date(y,m+1,0).getDate()+first.getDay())/7)*7:7;let a=['日','一','二','三','四','五','六'].map(w=>`<div class="dow">${w}</div>`).join('');for(let i=0;i<count;i++){let d=new Date(start);d.setDate(start.getDate()+i);let v=localDate(d),has=records.some(x=>x.date===v);a+=`<button class="day ${v===date?'sel':''}" style="${d.getMonth()!==m?'opacity:.38':''}" onclick="date='${v}';render()">${d.getDate()}${has?'<i class="dot"></i>':''}</button>`}return card(`<div class="row"><span>📅 ${y}年${m+1}月</span><div><button class="soft" onclick="shiftMonth(-1)">‹</button> <button class="soft" onclick="date=localDate(new Date());render()">今天</button> <button class="soft" onclick="shiftMonth(1)">›</button></div></div>`,`<div class="grid7">${a}</div><button class="soft" style="width:100%;margin-top:8px" onclick="expanded=!expanded;render()">${expanded?'收起周历 ↑':'展开月历 ↓'}</button>`)}
function shiftMonth(n){let d=dt(date);d.setDate(1);d.setMonth(d.getMonth()+n);date=localDate(d);render()}
function today(){let a=recs(),out=calendar()+`<div class="row"><h3>${fmt(date)} · ${['周日','周一','周二','周三','周四','周五','周六'][dt(date).getDay()]}</h3><button class="pill" onclick="quick()">＋ 记录</button></div>`;
let w=a.filter(x=>x.type==='work'),start=w.find(x=>x.category==='上班'),end=w.find(x=>x.category==='下班');out+=card('💼 工作台',`<div class="item"><span>上班 ${start?esc(start.time):'—'}　·　下班 ${end?esc(end.time):'—'}</span><button class="action" onclick="workPunch()">打卡</button></div>${a.filter(x=>['task','idea'].includes(x.type)).map(item).join('')}<button class="soft" onclick="openForm('task')">＋ 工作任务</button>`);
out+=card('🌱 小小成就',settings.habits.map(h=>{let ok=habitDone(h.name,date);return `<div class="item"><span>${esc(h.emoji)} ${esc(h.name)}</span><button class="action" onclick="checkHabit('${encodeURIComponent(h.name)}')">${ok?'✓ 已记录':'＋ 打卡'}</button></div>`}).join(''));
out+=card('🍱 今日食光', ['早餐','午餐','晚餐'].map(k=>{let x=a.find(r=>r.type==='meal'&&r.category===k);return `<div class="item"><span>${k}　${x?esc(x.title):'<span class="muted">还没记录</span>'}</span><button class="action" onclick="${x?`edit('${x.id}')`:`openForm('meal','${k}')`}">${x?'编辑':'＋ 记录'}</button></div>`}).join(''));
let expense=a.filter(x=>x.type==='expense').reduce((s,x)=>s+Number(x.amount||0),0),income=a.filter(x=>x.type==='income').reduce((s,x)=>s+Number(x.amount||0),0),salary=settings.salary/Math.max(1,settings.workdays);out+=card('🐷 今天的存钱罐',`<div class="stat"><div><small>参考日薪</small><strong>${money(salary)}</strong></div><div><small>今日支出</small><strong>${money(expense)}</strong></div><div><small>额外收入</small><strong>${money(income)}</strong></div><div><small>参考结余</small><strong>${money(salary+income-expense)}</strong></div></div><p class="small">参考日薪为工资折算展示，不计入实际到账收入。</p><button class="action" onclick="openForm('expense')">＋ 记一笔</button>`);
out+=card('💌 情绪口袋',`<div class="row"><span class="small">把今天的感受，轻轻放进口袋</span><button class="action" onclick="openForm('emotion')">＋ 放进口袋</button></div>${a.filter(x=>x.type==='emotion').map(item).join('')}`);
let rest=a.filter(x=>!['work','task','idea','meal','expense','income','emotion'].includes(x.type));out+=card('🌷 今天的其他足迹',rest.length?rest.map(item).join(''):'<div class="empty">没有记录也没关系，日子照样在向前。</div>');return out}
function habitDone(name,d){return records.some(x=>x.date===d&&(x.type==='habit'&&x.title===name || (name==='阅读'&&x.type==='reading')||(name==='观影'&&x.type==='movie')||(name==='运动'&&x.type==='sport')||(name==='睡眠'&&x.type==='sleep')))}
function checkHabit(s){let name=decodeURIComponent(s);if(habitDone(name,date)){let x=records.find(x=>x.date===date&&x.type==='habit'&&x.title===name);if(x){if(confirm('取消今天的这次打卡？')){records=records.filter(r=>r.id!==x.id);persist();render()}}else alert('这项习惯已由生活记录自动完成，可到对应记录中编辑。');return}saveRecord({type:'habit',date,title:name});celebrate(name)}
function celebrate(name){let div=document.createElement('div');div.className='toast';div.innerHTML=`🌟<br><b>${esc(name)}完成啦！</b><br><small>今天又积累了一点点 🌱</small>`;document.body.append(div);setTimeout(()=>div.remove(),900)}
function monthRecords(){return records.filter(x=>x.date.slice(0,7)===date.slice(0,7))}function weekRecords(){let d=dt(date);d.setDate(d.getDate()-d.getDay());let s=localDate(d);d.setDate(d.getDate()+6);let e=localDate(d);return records.filter(x=>x.date>=s&&x.date<=e)}
function finance(){let a=monthRecords(),spent=a.filter(x=>x.type==='expense').reduce((s,x)=>s+Number(x.amount||0),0),inc=a.filter(x=>x.type==='income').reduce((s,x)=>s+Number(x.amount||0),0),days=new Date(dt(date).getFullYear(),dt(date).getMonth()+1,0).getDate(),progress=dt(date).getDate()/days*100;return calendar()+card('🏡 小金库 · 本月',`<div class="stat"><div><small>本月支出</small><strong>${money(spent)}</strong></div><div><small>实际入账</small><strong>${money(inc)}</strong></div><div><small>月预算</small><strong>${money(settings.budget)}</strong></div><div><small>预算剩余</small><strong>${money(settings.budget-spent)}</strong></div></div><p class="small">预算使用 ${Math.round(spent/settings.budget*100)||0}% · 月份进度约 ${Math.round(progress)}%</p><div class="bar"><i style="width:${Math.min(100,spent/Math.max(1,settings.budget)*100)}%"></i></div><p class="note">${spent>settings.budget?'预算已超出，记得照顾好自己的节奏。':spent/settings.budget*100>progress+15?'本月消费进度稍快，可以留意一下。':'正在按自己的节奏积累，挺好。'}</p><button class="action" onclick="openForm('expense')">＋ 支出</button> <button class="action" onclick="openForm('income')">＋ 收入</button> <button class="soft" onclick="openSettings()">编辑预算</button>`)+card('📒 账本 · '+date.slice(0,7),a.filter(x=>['expense','income'].includes(x.type)).sort((x,y)=>y.date.localeCompare(x.date)).map(x=>`<div class="small">${x.date}</div>`+item(x)).join('')||'<div class="empty">还没有收支记录</div>')+card('🎁 心愿铺',a.filter(x=>x.type==='wish').map(item).join('')+`<button class="action" onclick="openForm('wish')">＋ 添加心愿</button>`)}
function work(){let a=monthRecords().filter(x=>['work','task','idea'].includes(x.type));let dates=[...new Set(a.filter(x=>x.type==='work').map(x=>x.date))],late=0,severe=0;dates.forEach(d=>{let e=records.find(x=>x.date===d&&x.type==='work'&&x.category==='下班');if(e){if(e.time>'19:30')late++;if(e.time>='21:30')severe++}});return calendar()+card('💼 工作台',`<div class="hstack"><button class="action" onclick="workPunch()">⏱ 上下班打卡</button><button class="action" onclick="openForm('task')">＋ 运营任务</button><button class="action" onclick="openForm('idea')">＋ 创意灵感</button></div><p class="note">本月晚于19:30下班 ${late} 天，21:30及以后 ${severe} 天。每周频次提醒以单周为准。</p>`)+card('工作记录',a.sort((x,y)=>y.date.localeCompare(x.date)).map(x=>`<div class="small">${x.date}</div>`+item(x)).join('')||'<div class="empty">从今天的一个任务开始</div>')}
function life(){let kinds=[['reading','📖 纸间漫游'],['movie','🎬 光影收藏馆'],['sport','🏃 活力补给站'],['trip','✈️ 旅行手账'],['walk','🚶 城市漫游'],['emotion','💌 情绪口袋'],['meal','🍱 今日食光']];return calendar()+card('🌿 生活收藏',`<div class="hstack">${kinds.map(([t,n])=>`<button class="chip" onclick="openForm('${t}')">＋ ${n}</button>`).join('')}</div>`)+kinds.map(([t,n])=>card(n,records.filter(x=>x.type===t).sort((x,y)=>y.date.localeCompare(x.date)).slice(0,12).map(x=>`<div class="small">${x.date}${x.time?' · '+x.time:''}</div>`+item(x)).join('')||'<div class="empty">还没有记录，想起来再记也不迟。</div>')).join('')}
function habits(){let a=settings.habits;return calendar()+card('🌱 小小成就',a.map(h=>{let source=h.period==='month'?monthRecords():weekRecords(),dates=[...new Set(source.filter(x=>habitDone(h.name,x.date)).map(x=>x.date))],n=dates.length;return `<div class="item"><div style="flex:1">${esc(h.emoji)} ${esc(h.name)}　<span class="small">${n}/${h.target} ${h.period==='month'?'本月':'本周'}</span><div class="bar"><i style="width:${Math.min(100,n/h.target*100)}%"></i></div></div><button class="action" onclick="checkHabit('${encodeURIComponent(h.name)}')">＋</button></div>`}).join('')+`<button class="soft" onclick="editHabits()">管理习惯</button>`)+card('🗓️ 周 / 月复盘',`<div class="hstack"><button class="action" onclick="review('week')">本周回顾</button><button class="action" onclick="review('month')">本月回顾</button><button class="action" onclick="openForm('plan')">＋ 新计划</button></div>${monthRecords().filter(x=>x.type==='plan').map(item).join('')}`)}
function review(period){let a=period==='week'?weekRecords():monthRecords(),expenses=a.filter(x=>x.type==='expense').reduce((s,x)=>s+Number(x.amount||0),0),work=a.filter(x=>x.type==='work'&&x.category==='下班').length;let counts=['reading','movie','sport','emotion','meal','habit','trip','walk'].map(t=>`${typ(t)}：${a.filter(x=>x.type===t).length}条`).join('<br>');show(`<div class="row"><h3>${period==='week'?'🗓️ 本周':'🌙 本月'}回顾</h3><button class="soft" onclick="closeModal()">关闭</button></div><p>工作下班记录：${work}天<br>期间支出：${money(expenses)}<br>${counts}</p><p class="note">只统计实际记录，不代表没有记录的日子什么都没发生。</p><button class="primary" onclick="openForm('emotion')">💌 留下一段感受（选填）</button>`)}
function render(){document.getElementById('app').innerHTML=({today,work,life,finance,habits}[tab])();document.getElementById('nav').innerHTML=[['today','☀️','今天'],['work','💼','工作'],['life','🌿','生活'],['finance','🏡','小金库'],['habits','🌱','习惯']].map(([t,i,n])=>`<button class="${tab===t?'active':''}" onclick="tab='${t}';render();window.scrollTo(0,0)"><b>${i}</b>${n}</button>`).join('')}
function show(content){document.getElementById('modal').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet">${content}</div></div>`}function closeModal(){document.getElementById('modal').innerHTML=''}function quick(){let types=['expense','income','meal','emotion','reading','movie','sport','task','idea','trip','walk','sleep','wish','plan'];show(`<div class="row"><h3>🌷 记录一点生活</h3><button class="soft" onclick="closeModal()">关闭</button></div><div class="hstack">${types.map(t=>`<button class="chip" onclick="openForm('${t}')">＋ ${typ(t)}</button>`).join('')}</div>`)}
function saveRecord(x){if(!x.id)x.id='r'+Date.now()+Math.random().toString(36).slice(2,7);records=records.filter(r=>r.id!==x.id);records.push(x);persist();closeModal();render()}
function edit(id){let x=records.find(x=>x.id===id);if(x)openForm(x.type,x.category,x)}
function openForm(type,category='',old=null){editing=old?.id||null;let x=old||{},isMeal=type==='meal',isMoney=['expense','income'].includes(type),isWork=type==='work';let opts={meal:['早餐','午餐','晚餐'],expense:['🍜 餐饮','🧋 咖啡奶茶','🚇 交通','🛍️ 购物','🏠 住房','🎬 娱乐','📚 阅读','✈️ 旅行','🧴 日用','✨ 其他'],income:['💼 工资','🧧 奖金','💻 兼职','📈 理财','↩️ 退款','🎁 礼金','✨ 其他'],task:['运营','投流','创意','其他'],work:['上班','下班'],emotion:['开心','平静','焦虑','烦躁','委屈','难过','感动','幸福','其他']};let label={meal:'吃了什么',expense:'金额',income:'金额',emotion:'想留下的感受',reading:'书名',movie:'电影名',sport:'运动项目',task:'任务名称',idea:'灵感',trip:'旅行计划',walk:'漫游地点',sleep:'睡眠时长/备注',wish:'心愿',plan:'计划',work:'打卡'}[type]||'内容';let sel=opts[type]?`<label class="field">分类<select id="cat">${opts[type].map(v=>`<option ${v===(x.category||category)?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`:'';let foods=isMeal?`<div class="field"><span>常吃的食物（点选即可）</span><div class="hstack">${settings.foods.map(v=>`<button class="chip" onclick="document.getElementById('ttl').value='${esc(v).replace(/'/g,'&#39;')}'">${esc(v)}</button>`).join('')}</div><button class="soft" onclick="addFood()">＋ 加入常吃</button></div>`:'';show(`<div class="row"><h3>${old?'编辑':'新增'} · ${typ(type)}</h3><button class="soft" onclick="closeModal()">关闭</button></div><form onsubmit="submitForm(event,'${type}')"><label class="field">日期<input id="day" type="date" required value="${esc(x.date||date)}"></label>${sel}${foods}${!isWork?`<label class="field">${label}<input id="ttl" ${isMoney?'type="number" min="0" step="0.01"':'type="text"'} ${isMoney?'required':''} value="${esc(isMoney?x.amount??'':x.title||'')}" placeholder="${isMoney?'输入金额':'可以留空，按需记录'}"></label>`:''}${['emotion','work'].includes(type)?`<label class="field">时间<input type="time" id="time" value="${esc(x.time||new Date().toTimeString().slice(0,5))}"></label>`:''}${type==='emotion'?`<label class="field">情绪强度（可选）<select id="intensity"><option value="">不记录</option>${[1,2,3,4,5].map(n=>`<option ${String(x.intensity||'')===String(n)?'selected':''}>${n}</option>`).join('')}</select></label><label class="field">发生场景（可选）<select id="scene">${['','工作','家庭','社交','独处','其他'].map(n=>`<option ${x.scene===n?'selected':''}>${n}</option>`).join('')}</select></label>`:''}<label class="field">备注 / 感受（选填）<textarea id="note">${esc(x.note||'')}</textarea></label><div class="row"><button class="primary" type="submit">保存记录</button>${old?`<button type="button" class="danger" onclick="removeRecord('${old.id}')">删除</button>`:''}</div></form>`)}
function submitForm(e,type){e.preventDefault();let old=editing?records.find(x=>x.id===editing):null,x={...(old||{}),type,date:document.getElementById('day').value,note:document.getElementById('note').value};let cat=document.getElementById('cat');if(cat)x.category=cat.value;let ttl=document.getElementById('ttl');if(ttl){if(['income','expense'].includes(type)){x.amount=Number(ttl.value);x.title=cat.value}else x.title=ttl.value.trim()}let time=document.getElementById('time');if(time)x.time=time.value;let intensity=document.getElementById('intensity');if(intensity)x.intensity=intensity.value;let scene=document.getElementById('scene');if(scene)x.scene=scene.value;if(type==='work')x.title=x.category+' '+x.time;saveRecord(x);if(['reading','movie','sport','sleep'].includes(type)&&!old)celebrate(typ(type))}
function removeRecord(id){if(confirm('确定删除这条记录吗？')){records=records.filter(x=>x.id!==id);persist();closeModal();render()}}
function addFood(){let n=prompt('输入食物名称（可加Emoji）');if(n&&n.trim()&&!settings.foods.includes(n.trim())){settings.foods.push(n.trim());persist();openForm('meal')}}
function workPunch(){let hasIn=recs().some(x=>x.type==='work'&&x.category==='上班'),cat=hasIn?'下班':'上班';openForm('work',cat)}
function editHabits(){show(`<h3>🌱 管理习惯</h3>${settings.habits.map((h,i)=>`<div class="item"><span>${esc(h.emoji)} ${esc(h.name)} · ${h.target}次/${h.period==='month'?'月':'周'}</span><button class="action" onclick="changeHabit(${i})">编辑</button></div>`).join('')}<button class="primary" onclick="changeHabit(-1)">＋ 新增习惯</button> <button class="soft" onclick="closeModal()">完成</button>`)}
function changeHabit(i){let old=settings.habits[i],name=prompt('习惯名称',old?.name||'');if(!name)return;let target=Number(prompt('目标次数',old?.target||3));if(!Number.isFinite(target)||target<1)return;let period=confirm('按每周统计？点取消则按每月统计。')?'week':'month';let emoji=prompt('Emoji',old?.emoji||'🌱')||'🌱';let h={name,emoji,target,period};if(i<0)settings.habits.push(h);else settings.habits[i]=h;persist();editHabits();render()}
function openSettings(){show(`<h3>⚙️ 设置与备份</h3><p class="note">数据保存在当前浏览器的本地存储中。清理浏览器数据或更换设备可能导致丢失，请定期导出备份。</p><label class="field">月工资（用于参考日薪，不算实际入账）<input id="salary" type="number" value="${settings.salary}"></label><label class="field">每月折算工作日<input id="workdays" type="number" value="${settings.workdays}"></label><label class="field">月度支出预算<input id="budget" type="number" value="${settings.budget}"></label><button class="primary" onclick="settings.salary=+document.getElementById('salary').value;settings.workdays=Math.max(1,+document.getElementById('workdays').value);settings.budget=Math.max(1,+document.getElementById('budget').value);persist();closeModal();render()">保存设置</button><hr style="border:0;border-top:1px solid #eee;margin:20px 0"><div class="hstack"><button class="action" onclick="exportData()">⬇️ 导出备份</button><label class="action">⬆️ 导入备份<input type="file" accept="application/json" style="display:none" onchange="importData(event)"></label></div><p class="small">V2.0 本地试用版 · 暂无云同步、自动健康数据、AI分析或照片贴纸生成。</p><button class="soft" onclick="closeModal()">关闭</button>`)}
function exportData(){let blob=new Blob([JSON.stringify({version:2,records,settings,exported:new Date().toISOString()},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='我的路_备份_'+localDate(new Date())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function importData(e){let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!Array.isArray(data.records)||!data.settings)throw Error('格式不正确');if(confirm('导入将覆盖当前本地数据。请先导出备份，确定继续？')){records=data.records;settings=data.settings;persist();closeModal();render();alert('导入完成')}}catch(err){alert('导入失败：'+err.message)}}
try{render()}catch(e){document.getElementById("app").insertAdjacentHTML("afterbegin",`<section class="card"><b>⚠️ 页面初始化失败</b><p class="note">${esc(e.message)}</p></section>`)}
</script></body></html>
